%YAML 1.1
---
$schema: 'http://stsci.edu/schemas/yaml-schema/draft-01'
id: 'asdf://astropy.org/regions/schemas/ellipse_region-1.0.0'
title: Ellipse Region in different coordinates.
description: |
  ASDF schema for serializing an ellipse region in pixel and sky
  coordinates. It applies to 'EllipsePixelRegion' and 'EllipseSkyRegion'.

type: object
properties:
  center:
    title: Center of the ellipse region.
    anyOf:
      - tag: 'tag:astropy.org:astropy/coordinates/skycoord-1.0.0'
      - tag: 'tag:astropy.org:regions/pixcoord-1.0.0'
  width:
    title: Width of the ellipse region.
    anyOf:
      - type: number
      - tag: 'tag:stsci.edu:asdf/unit/quantity-1.*'
    description: |
      The width of the ellipse region before rotation.
      It is in pixels for 'EllipsePixelRegion' and as an angle
      for 'EllipseSkyRegion'.
  height:
    title: Height of the ellipse region.
    anyOf:
      - type: number
      - tag: 'tag:stsci.edu:asdf/unit/quantity-1.*'
    description: |
      The height of the ellipse region before rotation.
      It is in pixels for 'EllipsePixelRegion' and as an angle
      for 'EllipseSkyRegion'.
  angle:
    tag: 'tag:stsci.edu:asdf/unit/quantity-1.*'
    title: Angle of the ellipse region.
    description: |
      The rotation angle of the ellipse, measured anti-clockwise. If
      set to zero (the default), the width axis is lined up with the
      longitude axis of the celestial coordinates or the 'x' axis
      of the pixel coordinates.
  meta:
    tag: 'tag:astropy.org:regions/meta-1.0.0'
  visual:
    tag: 'tag:astropy.org:regions/visual-1.0.0'

required: [center, width, height]
...
