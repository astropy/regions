%YAML 1.1
---
$schema: 'http://stsci.edu/schemas/yaml-schema/draft-01'
id: 'asdf://astropy.org/regions/schemas/circle_region-1.0.0'
title: Circle Region in different coordinates
description: |
  ASDF schema for serializing a circle region in pixel, sky
  and spherical coordinates. It applies to CirclePixelRegion,
  CircleSkyRegion and CircleSphericalSkyRegion.

type: object
properties:
  center:
    title: Center of the circle region.
    anyOf:
      - tag: 'tag:astropy.org:astropy/coordinates/skycoord-1.0.0'
      - tag: 'tag:astropy.org:regions/pixcoord-1.0.0'
  radius:
    title: Radius of the circle region.
    anyOf:
      - type: number
      - tag: 'tag:stsci.edu:asdf/unit/quantity-1.*'
  spherical:
    type: boolean
  meta:
    tag: 'tag:astropy.org:regions/meta-1.0.0'
  visual:
    tag: 'tag:astropy.org:regions/visual-1.0.0'

required: [center, radius, spherical]
...
