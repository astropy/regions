%YAML 1.1
---
$schema: "http://stsci.edu/schemas/yaml-schema/draft-01"
id: "asdf://astropy.org/regions/schemas/common-1.0.0"
title: Common schema definitions for regions
description: |
  ASDF schema for serializing region definitions.


definitions:
  meta:
    type: object
    title: Metadata associated with the region
    properties:
      background:
        type: float
        title: Background value for the region. (CRTF, DS9)
        description: |
          CRTF, DS9, and other region formats support a background value for the region. 
          This is a float value that can be used to specify the background 
          level of the region.
      comment:
        type: string
        title: Comment for the region. (CRTF, DS9)
        description: |
          CRTF, DS9, and other region formats support a comment for the region.
          Ex: meta['comment'] = 'This is a comment.'
      component:
      composite:
      type: boolean
        title: ???
      corr:
        anyOf:
          - type: array
            items:
              type: string
          - type: string
        title: Correlation Axis (CRTF)
        description: |
          Possible values: 'I', 'Q', 'U', 'V', 'RR', 'LL', 'RL', 'LR',
          'XX', 'YY', 'XY', 'YX', 'RX', 'RY', 'LX', 'LY', "XR', 'XL', 'YR',
          'YL', 'PP', 'QQ'. 'PQ', 'QP', RCircular', LCircular', 'Liear',
          'Ptotal', 'Plinear', 'Pangle', 'PFtotal', 'PFlinear'
          Default: all planes present in image
          Ex: meta['corr'] = ['X', 'Y']
      delete:
        type: boolean
        title: Delete the region in the DS9 GUI. (DS9)
        description: |
          DS9 supports a boolean flag to indicate whether the region should be
          deleted in the DS9 GUI.
          Ex: meta['delete'] = 1
      edit:
        type: boolean
        title: Edit the region in the DS9 GUI. (DS9)
        description: |
          DS9 supports a boolean flag to indicate whether the region should be
          editable in the DS9 GUI.
          Ex: meta['edit'] = 1
      fixed:
      frame:
        type: string
        title: Frequency / Velocity Axis (CRTF)
        description: |
          Possible values: 'REST', "LSRK', 'LSRD', 'BARY', 'GEO', 'TOPO',
          'GALACTO', 'LGROUP', 'CMB'
          Default: Image value
          Ex: meta['frame'] = 'TOPO'
      highlite:
      include:
        type: boolean
        title: Include the region in a plot.
        description: |
          CRTF, DS9, and other region formats support a boolean flag to indicate
          whether the region should be included in a plot.
      label:
        type: string
        title: Text label for the region.
        description: |
          CRTF, DS9, and other region formats support a text label for the region.
          This is a string that can be used to identify the region in a plot or in
          a list of regions.  
      line:
        type: array
        items:
          type: integer
        title: Line Region (DS9)
        description: |
          DS9 supports a line region rendered with arrows, one at each end.
          To indicate arrows, use the line property. A '1'indicates an arrow,
          '0' indicates no arrow.)
          Ex: meta['line'] = [1, 1]
      move:
        type: boolean
        title: Move the region in the DS9 GUI. (DS9)
        description: |
          DS9 supports a boolean flag to indicate whether the region should be
          movable in the DS9 GUI.
          Ex: meta['move'] = 1
      name:
        type: string
      range:
        type: array
        items:
          tag: "tag:stsci.edu:asdf/unit/quantity-1.*"
        title: Frequency / Velocity Range (CRTF)
        description: |
          Possible units: 'Hz', 'kHz', 'MHz', 'GHz', 'THz', 'm/s', 'km/s',
          'channel', chan' (=channel)
          Default: Image range
          Format: [min, max]
          Ex: meta['range'] = [-320 * u.m/u.s, -330 * u.m/u.s]
      restfreq:
        tag: "tag:stsci.edu:asdf/unit/quantity-1.*"
        title: Rest Frequency (CRTF)
        description: |
          Possible units: 'Hz', 'kHz', 'MHz', 'GHz', 'THz'
          Default: Image value
          Ex: meta['restfreq'] = 1.420405751786 * u.GHz
      rotate:
        type: boolean
        title: Rotate the region in the DS9 GUI. (DS9)
        description: |
          DS9 supports a boolean flag to indicate whether the region should be
          rotatable in the DS9 GUI.
          Ex: meta['rotate'] = 1
      select:
      source:
        type: string
        title: Source name
      tags:
        type: array
        items:
          type: string
        title: Tags for the region. (DS9)
        description: |
          A region may have zero or more tags associated with it, which may be used
          for grouping and searching.
          Ex: meta['tags'] = ['{Group 1}', '{Group 2}']}
      text:
      textrotate:
      type:
      veltype:
        type: string
        title: Velocity Calculation Type (CRTF)
        description: |
          Possible values: 'RADIO', 'OPTICAL', 'Z', "BETA', 'GAMMA'
          Ex: meta['veltype'] = 'RADIO'
  visual_meta:
    type: object
    title: Metadata for plotting.
    properties:
      color:
        type: string
        title: Region, symbol and text color (CRTF, DS9)
        description: |
          Any color recognized by matplotlib.
          The color may be specified as a named color, hex value, or RGB tuple.
          Ex: visual['color'] = 'red'
      dash:
        type: boolean
        title: Dashed line for plotting the region.
        description: |
          Render region using dashed lines using current dashlist value.
      dashlist:
        type: array
        items:
          type: string
        title: Dash pattern for plotting the region.
        description: |
          Sets dashed line parameters.
          This does not render the region in dashed lines.
      default_style:
        type: string
        title: Use default style for plotting the region.
        description: |
          Use the default style for the region, ignoring any other visual
          properties.
      edgecolor:
        type: string
        title: Edge color for plotting the region.
        description: |
          Any color recognized by matplotlib.
          The color may be specified as a named color, hex value, or RGB tuple.
          Ex: visual['edgecolor'] = 'blue'
      facecolor:
        type: string
        title: Face color for plotting the region.
        description: |
          Any color recognized by matplotlib.
          The color may be specified as a named color, hex value, or RGB tuple.
          Ex: visual['facecolor'] = 'blue'
      fill:
        type: boolean
        title: Fill the region for plotting.
        description: |
          Boolean value whether the region is filled.
      font:
        type: string
        title: Font for plotting the region.
        description: |
          The name of the font.
          Ex: visual['font'] = 'Times New Roman'
      fontname:
        type: string
        title: Font name for plotting the region.
        description: |
          The name of the font.
          Ex: visual['fontname'] = 'Times New Roman'
      fontsize:
        type: number
        title: Font size for plotting the region.
        description: |
          The font size is specified in points.
          Ex: visual['fontsize'] = 12.0
      fontstyle:
        type: string
        title: Font style for plotting the region.
        description: |
          The font style may be specified as a named style or a dash sequence.
          Ex: visual['fontstyle'] = 'italic'
      fontweight:
        anyOf:
          - type: string
          - type: integer
        title: Font weight for plotting the region.
        description: |
          The font weight may be specified as a named weight or a numeric value.
          Ex: visual['fontweight'] = 'light'
      labelcolor:
        type: string
        title: Label color for plotting the region.
        description: |
          Any color recognized by matplotlib.
          The color may be specified as a named color, hex value, or RGB tuple.
          Ex: visual['labelcolor'] = 'blue'
      labeloff:
        type: array
        items:
          type: number
        title: Label offset for plotting the region.
        description: |
          The label offset is specified in points.
          Ex: visual['labeloff'] = [5.0, 5.0]
      labelpos:
        type: string
        title: Label position for plotting the region.
        description: |
          The label position may be specified as a named position
          or a coordinate.
          Ex: visual['labelpos'] = 'top'
      line:
        type: array
        items:
          type: integer
        title: Line Region (DS9)
        description: |
          DS9 supports a line region rendered with arrows, one at each end.
          To indicate arrows, use the line property. A '1'indicates an arrow,
          '0' indicates no arrow.)
      linestyle:
        type: string
        title: Line style for plotting the region.
        description: |
          The line style may be specified as a named style or a dash sequence.
          Ex: visual['linestyle'] = 'dashed'
      linewidth:
        type: number
        title: Line width for plotting the region.
        description: |
          The line width is specified in points.
          Ex: visual['linewidth'] = 2.0
      marker:
        type: string
        title: Marker for plotting the region.
        description: |
          The marker may be specified as a named marker or a character.
          Ex: visual['marker'] = 'point marker'
      markeredgewidth:
        type: number
        title: Marker edge width for plotting the region.
        description: |
          The marker edge width is specified in points.
          Ex: visual['markeredgewidth'] = 2.0
      markersize:
        type: number
        title: Marker size for plotting the region.
        description: |
          The marker size is specified in points.
          Ex: visual['markersize'] = 5.0
      rotation:
        type: number
        title: Rotation for plotting the region.
        description: |
          The rotation is specified in degrees.
          Ex: visual['rotation'] = 45.0
      symbol:
        type: string
        title: Symbol for plotting the region.
        description: |
          The symbol may be specified as a named symbol or a character.
          Ex: visual['symbol'] = 'point marker'
      symsize:
        type: number
        title: Symbol size for plotting the region.
        description: |
          The symbol size is specified in points.
          Ex: visual['symsize'] = 5.0
      symthick:
        type: number
        title: Symbol thickness for plotting the region.
        description: |
          The symbol thickness is specified in points.
          Ex: visual['symthick'] = 2.0
      textangle:
        type: number
        title: Text angle for plotting the region.
        description: |
          The text angle is specified in degrees.
          Ex: visual['textangle'] = 45.0
      textrotate:
        type: number
        title: Text rotation for plotting the region.
        description: |
          The text rotation is specified in degrees.
          Ex: visual['textrotate'] = 45.0
      usetex:
        type: boolean
        title: Use TeX for plotting the region.
        description: |
          Render text using TeX.
...
